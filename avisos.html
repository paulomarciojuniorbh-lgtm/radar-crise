<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Avisos Radar Crise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna de cartões, um por pessoa cadastrada, com a mensagem pronta e os botões de envio */
:root{
  --bg:#F4F3F1; --surface:#FFFFFF; --sunk:#ECEAE6; --ink:#1C1A17; --muted:#625D56; --line:#DCD8D2;
  --accent:#A33A1E; --accent-ink:#FFFFFF; --good:#16794F; --good-soft:#DDF1E7;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141210;--surface:#1C1916;--sunk:#24201C;--ink:#EDE8E2;--muted:#A39B91;--line:#352F29;--accent:#F0957A;--accent-ink:#1A0F0B;--good:#5DD39E;--good-soft:#143428;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141210;--surface:#1C1916;--sunk:#24201C;--ink:#EDE8E2;--muted:#A39B91;--line:#352F29;--accent:#F0957A;--accent-ink:#1A0F0B;--good:#5DD39E;--good-soft:#143428;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2{font-family:var(--display);font-stretch:85%;margin:0;text-wrap:balance}
h1{font-size:30px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
form.tok{display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;flex:1;min-width:0}
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.card.feito{opacity:.6}
.quem{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.quem h2{font-size:20px}
.contato{font:13px var(--mono);color:var(--muted);overflow-wrap:anywhere;user-select:all}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:8px;padding:12px;font:13px/1.5 var(--mono)}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.ok{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-size:14px}
.vazio{color:var(--muted);padding:24px 0}
</style></head>
<body>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <span class="eyebrow">Radar Crise · uso interno</span>
    <h1>Avisos para enviar</h1>
    <p class="sub">Cada cartão é uma pessoa que pediu para monitorar empresas. Aparecem só os processos e marcos que ela ainda não recebeu. Mande pelo WhatsApp ou e-mail e depois marque como enviado. A lista é atualizada de hora em hora.</p>
  </header>
  <form class="tok" id="fTok"><input id="tok" type="password" placeholder="Código de acesso" aria-label="Código de acesso" autocomplete="off"><button class="btn pri" type="submit">Abrir</button></form>
  <div id="msg" role="status"></div>
  <div id="lista" style="display:grid;gap:12px"></div>
</div>
<script>
(function(){
  const API = "https://ryhyvzwqtktaaonznizn.supabase.co/rest/v1/rpc/", KEY = "sb_publishable_Ji31DC1ihqZTR7gmLeYTLw_GHgBjWN0";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const CL = { RJ: "Recuperação judicial", "Falência": "Pedido de falência", Extrajudicial: "Recuperação extrajudicial", "Autofalência": "Autofalência", Cautelar: "Cautelar antes da recuperação judicial" };
  const MARCO = { processo: "processo encontrado", deferido: "processamento deferido", edital_credores: "edital com lista de credores (prazo de 15 dias para habilitar ou divergir)", agc: "assembleia de credores marcada", plano: "plano de recuperação apresentado", concedida: "plano aprovado / recuperação concedida", venda_ativos: "venda de bens ou leilão", falencia_decretada: "FALÊNCIA DECRETADA", encerramento: "processo encerrado", indeferido: "pedido indeferido ou extinto" };
  const ORDEM = Object.keys(MARCO);
  let token = ""; try { token = localStorage.getItem("rc_admin") || ""; } catch (_) {}
  $("tok").value = token;
  const rpc = async (fn, body) => { const r = await fetch(API + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(r.status === 400 || r.status === 401 ? "Código de acesso errado." : "Erro " + r.status); return r.json(); };
  function texto(c) {
    const l = [`Olá, ${c.nome.split(" ")[0]}! Aqui é o Radar Crise.`, "", `Novidades sobre ${c.itens.length > 1 ? "as empresas" : "a empresa"} que você monitora:`];
    for (const i of c.itens) {
      const ms = (i.marcos || []).slice().sort((a, b) => ORDEM.indexOf(a) - ORDEM.indexOf(b)).map(m => MARCO[m] || m);
      l.push("", `*${i.devedor || "Empresa em identificação"}*${i.cnpj ? " (CNPJ " + i.cnpj + ")" : ""}`, `${CL[i.classe] || i.classe} · ${i.uf || ""} · processo ${i.numero}`);
      if (i.vara) l.push(i.vara.trim());
      if (ms.length) l.push("Marcos: " + ms.join("; "));
      if (i.aj) l.push("Administrador judicial: " + i.aj);
      if (i.link) l.push(i.link);
    }
    l.push("", "Confira sempre os autos no tribunal. Para parar de receber, é só responder esta mensagem.");
    return l.join("\n");
  }
  function zap(n) { let d = String(n || "").replace(/\D/g, ""); if (!d) return ""; if (d.length <= 11) d = "55" + d; return d; }
  async function carregar() {
    $("msg").innerHTML = ""; $("lista").innerHTML = `<p class="vazio">Carregando…</p>`;
    try {
      const dados = await rpc("crise_avisos_pendentes", { token });
      try { localStorage.setItem("rc_admin", token); } catch (_) {}
      if (!dados.length) { $("lista").innerHTML = `<p class="vazio">Nenhum aviso pendente. Quando alguém da lista de monitoramento aparecer num processo novo ou mudar de fase, o aviso aparece aqui.</p>`; return; }
      $("lista").innerHTML = dados.map(c => {
        const t = texto(c), w = zap(c.whatsapp);
        return `<article class="card" data-c="${c.cadastro}">
          <div class="quem"><h2>${esc(c.nome)}${c.empresa ? " · " + esc(c.empresa) : ""}</h2><span class="eyebrow">${c.itens.length} empresa${c.itens.length > 1 ? "s" : ""}</span></div>
          <div class="contato">${c.whatsapp ? "WhatsApp " + esc(c.whatsapp) : ""}${c.whatsapp && c.email ? " · " : ""}${c.email ? esc(c.email) : ""}</div>
          <pre>${esc(t)}</pre>
          <div class="acoes">
            ${w ? `<a class="btn pri" href="https://wa.me/${w}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">Abrir no WhatsApp</a>` : ""}
            ${c.email ? `<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent("Radar Crise: novidades das empresas que você monitora")}&body=${encodeURIComponent(t.replace(/\*/g, ""))}">Abrir e-mail</a>` : ""}
            <button class="btn" type="button" data-copiar="1">Copiar mensagem</button>
            <button class="btn" type="button" data-feito="${c.cadastro}">Marcar como enviado</button>
          </div>
        </article>`;
      }).join("");
    } catch (e) { $("lista").innerHTML = ""; $("msg").innerHTML = `<p class="ok" style="background:var(--sunk);color:var(--ink)">${esc(e.message)}</p>`; }
  }
  $("fTok").addEventListener("submit", e => { e.preventDefault(); token = $("tok").value.trim(); if (token) carregar(); });
  $("lista").addEventListener("click", async e => {
    const cp = e.target.closest("[data-copiar]");
    if (cp) { const t = cp.closest(".card").querySelector("pre").textContent; try { await navigator.clipboard.writeText(t); cp.textContent = "Copiado"; } catch (_) { const r = document.createRange(); r.selectNodeContents(cp.closest(".card").querySelector("pre")); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = "Texto selecionado"; } return; }
    const b = e.target.closest("[data-feito]"); if (!b) return;
    b.disabled = true;
    try { await rpc("crise_avisos_marcar", { token, cad: +b.dataset.feito }); const card = b.closest(".card"); card.classList.add("feito"); b.textContent = "Enviado"; }
    catch (err) { b.disabled = false; $("msg").innerHTML = `<p class="ok" style="background:var(--sunk);color:var(--ink)">${esc(err.message)}</p>`; }
  });
  if (token) carregar();
})();
</script>
</body></html>
